<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Krampouezh — Empile les crêpes</title>
  <meta name="description" content="Empile les crêpes le plus haut possible. Un petit jeu breton signé breizh.dev.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #faf6ef;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      text-align: center;
      color: #2b2b2b;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      padding: 1.5rem 1rem 2.5rem;
      overflow-y: auto;
    }

    .overlay.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .overlay > * { flex-shrink: 0; }
    .overlay > :first-child { margin-top: auto; }
    .overlay > :last-child { margin-bottom: auto; }

    .overlay h1 {
      font-size: clamp(2rem, 8vw, 3.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .overlay .flag {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
    }

    .overlay p {
      font-size: 1.05rem;
      color: #6b6357;
    }

    .overlay .big-score {
      font-size: clamp(3rem, 14vw, 5rem);
      font-weight: 700;
      line-height: 1;
    }

    .overlay .hint {
      margin-top: 1rem;
      padding: 0.7rem 1.6rem;
      border: 2px solid #2b2b2b;
      border-radius: 999px;
      font-weight: 600;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    #hud {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: 0;
      right: 0;
      text-align: center;
      color: #2b2b2b;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #hud.visible { opacity: 1; }

    #hud .score {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    #hud .best {
      font-size: 0.9rem;
      color: #6b6357;
      margin-top: 0.2rem;
    }

    footer {
      position: fixed;
      bottom: max(0.6rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #b0a794;
      pointer-events: none;
    }

    footer a { color: inherit; pointer-events: auto; }

    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:disabled { cursor: default; opacity: 0.6; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #a65d12;
      outline-offset: 4px;
    }
    .hint { background: #faf6ef; color: #2b2b2b; }
    .secondary {
      border: 0;
      border-radius: 999px;
      background: #ece5d9;
      color: #514635;
      padding: 0.65rem 1.2rem;
      font-weight: 600;
    }
    #score-form {
      width: min(100%, 22rem);
      padding: 1rem;
      border: 1px solid #ded3c2;
      border-radius: 1rem;
      background: #faf6ef;
      text-align: left;
    }
    #score-form label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
    .submit-row { display: flex; gap: 0.5rem; }
    #player-name {
      width: 100%;
      min-width: 0;
      padding: 0.65rem;
      border: 1px solid #b0a794;
      border-radius: 0.5rem;
      background: #fffdf9;
      color: #2b2b2b;
      user-select: text;
      -webkit-user-select: text;
    }
    #submit-score { border: 0; border-radius: 0.5rem; background: #2b2b2b; color: #faf6ef; padding: 0.65rem 0.9rem; }
    #submit-status { max-width: 24rem; font-size: 0.9rem; }
    #submit-status:empty { display: none; }
    #leaderboard {
      margin: auto;
      width: min(28rem, calc(100% - 2rem));
      max-height: calc(100dvh - 2rem);
      padding: 1.25rem;
      border: 1px solid #ded3c2;
      border-radius: 1.25rem;
      background: #faf6ef;
      color: #2b2b2b;
      box-shadow: 0 1rem 4rem #2b2b2b26;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    #leaderboard::backdrop { background: #2b2b2b70; }
    .leaderboard-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; position: sticky; top: 0; padding: 0.4rem 0; background: #faf6ef; }
    .leaderboard-header h2 { font-size: 1.4rem; }
    #close-leaderboard { padding: 0.5rem 0.75rem; }
    .leaderboard-caption, #leaderboard-status { margin-top: 0.75rem; color: #6b6357; font-size: 0.9rem; }
    #player-rank { margin-top: 1rem; padding: 0.8rem; border-radius: 0.75rem; background: #f3dfb9; font-weight: 600; }
    #leaderboard-list { list-style: none; margin-top: 1rem; }
    #leaderboard-list li { display: grid; grid-template-columns: 2.5rem 1fr auto; align-items: baseline; gap: 0.5rem; padding: 0.65rem 0; border-bottom: 1px solid #e5ddcf; }
    #leaderboard-list .rank { color: #80705a; font-variant-numeric: tabular-nums; }
    #leaderboard-list .name { overflow-wrap: anywhere; min-width: 0; }
    #leaderboard-list .points { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #leaderboard-list .own-score { color: #8b4e11; background: #f3dfb944; }
    #refresh-leaderboard { margin-top: 1rem; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .overlay { transition: none; }
      .overlay .hint { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="score">0</div>
    <div class="best"></div>
  </div>

  <div id="title-screen" class="overlay visible" data-game-ui>
    <div class="flag">⬛⬜⬛</div>
    <h1>Krampouezh</h1>
    <p>Empile les crêpes le plus haut possible.<br>Ce qui dépasse est coupé !</p>
    <button type="button" class="hint" id="play">Tape pour jouer</button>
    <button type="button" class="secondary" data-leaderboard>Classement</button>
  </div>

  <div id="over-screen" class="overlay" data-game-ui>
    <p>Ta pile de crêpes :</p>
    <div class="big-score">0</div>
    <p class="record-line"></p>
    <form id="score-form" hidden>
      <label for="player-name">Ton pseudo pour le classement</label>
      <div class="submit-row">
        <input id="player-name" name="name" minlength="2" maxlength="20" required autocomplete="nickname" placeholder="Ex. : Bigouden" aria-describedby="submit-status">
        <button id="submit-score" type="submit">Envoyer</button>
      </div>
    </form>
    <p id="submit-status" role="status" aria-live="polite"></p>
    <button type="button" class="hint" id="replay">Rejouer</button>
    <button type="button" class="secondary" data-leaderboard>Classement</button>
  </div>

  <dialog id="leaderboard" aria-labelledby="leaderboard-title" aria-describedby="leaderboard-caption">
    <div class="leaderboard-header">
      <h2 id="leaderboard-title">Les meilleures piles</h2>
      <button type="button" class="secondary" id="close-leaderboard" autofocus>Fermer</button>
    </div>
    <p class="leaderboard-caption" id="leaderboard-caption">Top 100 · Toutes les parties comptent.</p>
    <p id="player-rank" hidden></p>
    <p id="leaderboard-status" role="status" aria-live="polite"></p>
    <ol id="leaderboard-list" aria-label="Top 100 des scores"></ol>
    <button type="button" class="secondary" id="refresh-leaderboard">Actualiser</button>
  </dialog>

  <footer>krampouezh.<a href="https://breizh.dev">breizh.dev</a></footer>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const hudScore = hud.querySelector('.score');
    const hudBest = hud.querySelector('.best');
    const titleScreen = document.getElementById('title-screen');
    const overScreen = document.getElementById('over-screen');
    const overScore = overScreen.querySelector('.big-score');
    const overRecord = overScreen.querySelector('.record-line');
    const scoreForm = document.getElementById('score-form');
    const playerName = document.getElementById('player-name');
    const submitScore = document.getElementById('submit-score');
    const submitStatus = document.getElementById('submit-status');
    const leaderboard = document.getElementById('leaderboard');
    const leaderboardList = document.getElementById('leaderboard-list');
    const leaderboardStatus = document.getElementById('leaderboard-status');
    const playerRank = document.getElementById('player-rank');

    const BLOCK_H = 30;          // hauteur d'une crêpe (px CSS)
    const BASE_W_RATIO = 0.55;   // largeur de départ vs largeur écran
    const PERFECT_TOLERANCE = 7; // marge (px) pour un empilement parfait
    const BEST_KEY = 'krampouezh-best';
    const NAME_KEY = 'krampouezh-name';
    const ENTRY_KEY = 'krampouezh-entry';

    function readLocal(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }

    function writeLocal(key, value) {
      try { localStorage.setItem(key, value); } catch { /* Le jeu reste utilisable sans stockage local. */ }
    }

    let W = 0, H = 0, dpr = 1;
    let state = 'title'; // title | playing | over
    let stack = [];      // { x, w, seed, butter }
    let current = null;  // { x, w, dir, speed, seed }
    let debris = [];     // { x, w, y, vx, vy, rot, vr, seed }
    let popups = [];     // { text, x, y, life }
    let score = 0;
    let combo = 0;
    let best = Number(readLocal(BEST_KEY)) || 0;
    let cameraY = 0;     // décalage vertical du monde (monte avec la pile)
    let cameraTarget = 0;
    let inputLocked = false;
    let pendingScore = null;
    let latestSubmission = null;
    let lastEntryId = readLocal(ENTRY_KEY);
    if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(lastEntryId || '')) lastEntryId = null;
    let leaderboardRequest = 0;
    playerName.value = readLocal(NAME_KEY) || '';

    const numberFormat = new Intl.NumberFormat('fr-FR');

    function rankText(rank, total) {
      return `Ton score : ${numberFormat.format(rank)}${rank === 1 ? 'er' : 'e'} sur ${numberFormat.format(total)} score${total === 1 ? '' : 's'}.`;
    }

    async function requestLeaderboard(options = {}, entryId = lastEntryId) {
      const query = entryId && !options.method ? `?id=${encodeURIComponent(entryId)}` : '';
      let response;
      try {
        response = await fetch(`/api/leaderboard${query}`, {
          ...options,
          signal: AbortSignal.timeout(8000),
        });
      } catch {
        throw new Error('Connexion impossible. Vérifie ton réseau puis réessaie.');
      }
      if (!response.ok) {
        if (response.status === 429) throw new Error('Un peu de patience : réessaie dans une minute.');
        throw new Error('Le classement est indisponible. Réessaie dans un instant.');
      }
      return response.json();
    }

    function renderLeaderboard(data, entryId) {
      leaderboardList.replaceChildren();
      data.entries.forEach((entry, index) => {
        const row = document.createElement('li');
        if (entry.id === entryId) row.className = 'own-score';
        const rank = document.createElement('span');
        rank.className = 'rank';
        rank.textContent = `${index + 1}.`;
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = entry.name;
        const points = document.createElement('span');
        points.className = 'points';
        points.textContent = `${numberFormat.format(entry.score)} pts`;
        row.append(rank, name, points);
        leaderboardList.append(row);
      });
      leaderboardStatus.textContent = data.total
        ? `${numberFormat.format(data.total)} score${data.total === 1 ? ' enregistré' : 's enregistrés'}. À toi de jouer !`
        : 'Aucun score pour le moment. Lance la première pile !';
      playerRank.hidden = data.rank == null;
      playerRank.textContent = data.rank == null ? '' : rankText(data.rank, data.total);
    }

    async function loadLeaderboard() {
      const request = ++leaderboardRequest;
      const entryId = lastEntryId;
      leaderboardStatus.textContent = 'Chargement du classement…';
      leaderboardList.replaceChildren();
      playerRank.hidden = true;
      try {
        const data = await requestLeaderboard({}, entryId);
        if (request === leaderboardRequest) renderLeaderboard(data, entryId);
      } catch (error) {
        if (request === leaderboardRequest) leaderboardStatus.textContent = error.message;
      }
    }

    document.querySelectorAll('[data-leaderboard]').forEach(button => {
      button.addEventListener('click', () => {
        leaderboard.showModal();
        loadLeaderboard();
      });
    });
    document.getElementById('close-leaderboard').addEventListener('click', () => leaderboard.close());
    document.getElementById('refresh-leaderboard').addEventListener('click', loadLeaderboard);

    scoreForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!pendingScore || submitScore.disabled) return;
      const name = playerName.value.trim();
      if (Array.from(name).length < 2 || Array.from(name).length > 20 || /[\p{Cc}\p{Cf}]/u.test(name)) {
        submitStatus.textContent = 'Choisis un pseudo de 2 à 20 caractères, sans caractère invisible.';
        playerName.focus();
        return;
      }
      // Une nouvelle partie peut commencer avant le retour de la requête.
      const submission = pendingScore;
      submission.name ??= name;
      latestSubmission = submission;
      playerName.value = submission.name;
      writeLocal(NAME_KEY, submission.name);
      submitScore.disabled = true;
      playerName.disabled = true;
      submitStatus.textContent = 'Envoi du score…';
      try {
        const data = await requestLeaderboard({
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(submission),
        });
        if (latestSubmission !== submission) return;
        lastEntryId = submission.id;
        writeLocal(ENTRY_KEY, lastEntryId);
        // Invalide aussi un chargement du classement lancé pendant l'envoi.
        ++leaderboardRequest;
        if (leaderboard.open) renderLeaderboard(data, lastEntryId);
        if (pendingScore !== submission) return;
        pendingScore = null;
        scoreForm.hidden = true;
        submitStatus.textContent = `Score enregistré ! ${rankText(data.rank, data.total)}`;
      } catch (error) {
        if (pendingScore !== submission) return;
        submitStatus.textContent = `${error.message} Ton score peut être renvoyé.`;
        submitScore.disabled = false;
        // Conserve le même pseudo et le même identifiant pour une reprise sans doublon.
      }
    });

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Position Y (écran) du haut de la crêpe d'indice i
    function blockTopY(i) {
      return H - 90 - (i + 1) * BLOCK_H + cameraY;
    }

    function newGame() {
      pendingScore = null;
      document.activeElement?.blur();
      stack = [{ x: (W - W * BASE_W_RATIO) / 2, w: W * BASE_W_RATIO, seed: Math.random(), butter: false }];
      debris = [];
      popups = [];
      score = 0;
      combo = 0;
      cameraY = 0;
      cameraTarget = 0;
      spawnCurrent();
      state = 'playing';
      hudScore.textContent = '0';
      hudBest.textContent = best > 0 ? `Record : ${best}` : '';
      titleScreen.classList.remove('visible');
      titleScreen.inert = true;
      overScreen.classList.remove('visible');
      overScreen.inert = true;
      hud.classList.add('visible');
    }

    function spawnCurrent() {
      const top = stack[stack.length - 1];
      const fromLeft = stack.length % 2 === 0;
      current = {
        x: fromLeft ? -top.w : W,
        w: top.w,
        dir: fromLeft ? 1 : -1,
        speed: Math.min(3 + score * 0.09, 8) * (W / 500),
        seed: Math.random(),
      };
    }

    function drop() {
      const top = stack[stack.length - 1];
      const delta = current.x - top.x;
      const overlapStart = Math.max(current.x, top.x);
      const overlapEnd = Math.min(current.x + current.w, top.x + top.w);
      const overlap = overlapEnd - overlapStart;
      const y = blockTopY(stack.length);

      if (overlap <= 0) {
        // Raté : toute la crêpe tombe
        debris.push({ x: current.x, w: current.w, y, vx: current.dir * 2, vy: -2, rot: 0, vr: current.dir * 0.06, seed: current.seed });
        current = null;
        gameOver();
        return;
      }

      const perfect = Math.abs(delta) <= PERFECT_TOLERANCE;
      if (perfect) {
        combo++;
        const bonus = combo;
        score += 1 + bonus;
        // Une pile parfaite regonfle légèrement la crêpe
        const grow = Math.min(10, W * BASE_W_RATIO - top.w);
        stack.push({ x: top.x - grow / 2, w: top.w + grow, seed: current.seed, butter: true });
        popups.push({ text: bonus > 1 ? `Parfait ! +${1 + bonus}` : 'Parfait ! +2', x: W / 2, y: y - 14, life: 1 });
      } else {
        combo = 0;
        score += 1;
        // La partie qui dépasse tombe
        if (delta > 0) {
          debris.push({ x: overlapEnd, w: current.w - overlap, y, vx: 1.5, vy: -1.5, rot: 0, vr: 0.05, seed: current.seed });
        } else {
          debris.push({ x: current.x, w: current.w - overlap, y, vx: -1.5, vy: -1.5, rot: 0, vr: -0.05, seed: current.seed });
        }
        stack.push({ x: overlapStart, w: overlap, seed: current.seed, butter: false });
      }

      hudScore.textContent = score;
      cameraTarget = Math.max(0, (stack.length * BLOCK_H) - H * 0.45);
      spawnCurrent();
    }

    function gameOver() {
      state = 'over';
      inputLocked = true;
      const isRecord = score > best;
      if (isRecord) {
        best = score;
        writeLocal(BEST_KEY, best);
      }
      pendingScore = score > 0 ? { id: crypto.randomUUID(), score } : null;
      scoreForm.hidden = !pendingScore;
      submitScore.disabled = false;
      playerName.disabled = false;
      submitStatus.textContent = '';
      overScore.textContent = score;
      overRecord.textContent = isRecord && score > 0
        ? '🎉 Nouveau record !'
        : (best > 0 ? `Record : ${best}` : '');
      setTimeout(() => {
        hud.classList.remove('visible');
        overScreen.classList.add('visible');
        overScreen.inert = false;
        overScreen.scrollTop = 0;
        inputLocked = false;
      }, 700);
    }

    function onTap(e) {
      if (e?.target?.closest?.('a, button, input, form, dialog, [data-game-ui]')) return;
      if (inputLocked || leaderboard.open) return;
      if (state === 'playing') drop();
      else newGame();
    }
    document.getElementById('play').addEventListener('click', newGame);
    document.getElementById('replay').addEventListener('click', newGame);
    window.addEventListener('pointerdown', onTap);
    window.addEventListener('keydown', (e) => {
      if (e.target.closest?.('a, button, input, form, dialog') || leaderboard.open) return;
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (!e.repeat) onTap(e);
      }
    });

    // ---- Rendu ----

    // Petit générateur pseudo-aléatoire déterministe pour les taches de cuisson
    function mulberry(seed) {
      let t = Math.floor(seed * 1e9);
      return () => {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function drawCrepe(x, y, w, seed, butter) {
      const r = BLOCK_H / 2;
      const grad = ctx.createLinearGradient(0, y, 0, y + BLOCK_H);
      grad.addColorStop(0, '#f2b95c');
      grad.addColorStop(0.5, '#e09b3a');
      grad.addColorStop(1, '#b96f22');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, w, BLOCK_H, r);
      ctx.fill();

      // Bord inférieur plus cuit
      ctx.strokeStyle = 'rgba(122, 66, 15, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Taches de cuisson déterministes
      const rand = mulberry(seed);
      ctx.fillStyle = 'rgba(140, 80, 20, 0.28)';
      const spots = Math.max(2, Math.floor(w / 45));
      for (let i = 0; i < spots; i++) {
        const sx = x + r + rand() * Math.max(1, w - 2 * r);
        const sy = y + 6 + rand() * (BLOCK_H - 12);
        const sr = 2 + rand() * 4;
        ctx.beginPath();
        ctx.ellipse(sx, sy, sr * 1.4, sr, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Reflet doré sur le dessus
      ctx.fillStyle = 'rgba(255, 240, 200, 0.35)';
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 3, Math.max(0, w - 8), 6, 3);
      ctx.fill();

      // Noisette de beurre pour les empilements parfaits
      if (butter) {
        const bw = 14, bh = 9;
        const bx = x + w / 2 - bw / 2;
        const by = y - bh + 3;
        ctx.fillStyle = '#ffe27a';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180, 140, 20, 0.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawPlate() {
      const y = blockTopY(-1); // dessus de l'assiette = dessous de la 1re crêpe
      const pw = Math.min(W * 0.8, W * BASE_W_RATIO + 90);
      const px = (W - pw) / 2;
      // Assiette
      ctx.fillStyle = '#e5e0d5';
      ctx.beginPath();
      ctx.ellipse(W / 2, y + 14, pw / 2, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f3efe6';
      ctx.beginPath();
      ctx.ellipse(W / 2, y + 10, pw / 2 - 10, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      // Pied
      ctx.fillStyle = '#d8d2c4';
      ctx.fillRect(px + pw / 2 - 30, y + 22, 60, 8);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Rayures gwenn-ha-du discrètes en fond
      ctx.fillStyle = 'rgba(43, 43, 43, 0.03)';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(0, (H / 9) * (i * 2), W, H / 9);
      }

      drawPlate();

      for (let i = 0; i < stack.length; i++) {
        drawCrepe(stack[i].x, blockTopY(i), stack[i].w, stack[i].seed, stack[i].butter);
      }

      if (current && state === 'playing') {
        drawCrepe(current.x, blockTopY(stack.length), current.w, current.seed, false);
      }

      for (const d of debris) {
        ctx.save();
        ctx.translate(d.x + d.w / 2, d.y + BLOCK_H / 2);
        ctx.rotate(d.rot);
        drawCrepe(-d.w / 2, -BLOCK_H / 2, d.w, d.seed, false);
        ctx.restore();
      }

      ctx.textAlign = 'center';
      ctx.font = '700 20px "Avenir Next", "Segoe UI", sans-serif';
      for (const p of popups) {
        ctx.fillStyle = `rgba(43, 43, 43, ${p.life})`;
        ctx.fillText(p.text, p.x, p.y - (1 - p.life) * 30);
      }
    }

    function update() {
      if (current && state === 'playing') {
        current.x += current.dir * current.speed;
        // Rebond sur les bords (avec un peu de marge au-delà de l'écran)
        if (current.dir > 0 && current.x > W - current.w * 0.25) current.dir = -1;
        if (current.dir < 0 && current.x < -current.w * 0.75) current.dir = 1;
      }

      cameraY += (cameraTarget - cameraY) * 0.08;

      for (const d of debris) {
        d.x += d.vx;
        d.y += d.vy;
        d.vy += 0.5;
        d.rot += d.vr;
      }
      debris = debris.filter((d) => d.y < H + cameraY + 100);

      for (const p of popups) p.life -= 0.02;
      popups = popups.filter((p) => p.life > 0);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Écran titre : une jolie pile de démo
    stack = [{ x: (W - W * BASE_W_RATIO) / 2, w: W * BASE_W_RATIO, seed: 0.42, butter: false }];
    for (let i = 1; i < 4; i++) {
      const prev = stack[i - 1];
      stack.push({ x: prev.x + (i % 2 ? 8 : -6), w: prev.w - 10, seed: 0.42 + i * 0.13, butter: i === 3 });
    }

    loop();
  </script>
</body>
</html>
