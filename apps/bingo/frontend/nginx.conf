server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Preserve HTTPS when TLS is terminated by Traefik.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /bingo {
        return 308 /bingo/;
    }

    # These paths belong to the backend; never answer API calls with the SPA.
    location = /bingo/api { return 404; }
    location ^~ /bingo/api/ { return 404; }
    location = /bingo/hub { return 404; }
    location ^~ /bingo/hub/ { return 404; }

    location ^~ /bingo/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /bingo/ {
        try_files $uri $uri/ /bingo/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
