<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4f0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>" />
  <title>Prout</title>
  <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 32%, #ffffff, #eceae4);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    button {
      font-size: clamp(5rem, 30vw, 12rem);
      line-height: 1;
      padding: 0;
      width: clamp(9rem, 45vw, 16rem);
      height: clamp(9rem, 45vw, 16rem);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(60, 50, 35, 0.14),
                  0 4px 10px rgba(60, 50, 35, 0.08),
                  inset 0 1px 2px rgba(255, 255, 255, 0.9),
                  inset 0 -6px 14px rgba(60, 50, 35, 0.05);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.12s ease;
      user-select: none;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 48px rgba(60, 50, 35, 0.18),
                  0 6px 12px rgba(60, 50, 35, 0.1),
                  inset 0 1px 2px rgba(255, 255, 255, 0.9),
                  inset 0 -6px 14px rgba(60, 50, 35, 0.05);
    }
    button:active,
    button.squish {
      transform: scale(0.9);
      box-shadow: 0 6px 16px rgba(60, 50, 35, 0.12),
                  inset 0 3px 10px rgba(60, 50, 35, 0.12);
    }
    button:focus-visible {
      outline: 3px solid #c9a24b;
      outline-offset: 6px;
    }
  </style>
</head>
<body>
  <button id="prout" aria-label="Faire un prout" title="Appuie !">💩</button>

  <script>
    const button = document.getElementById("prout");

    // Real recorded fart samples, played at random. Files are fetched on
    // first use (and then browser-cached), so the page loads instantly.
    const SOUNDS = [
      "sounds/fart-01.wav",
      "sounds/fart-02.wav",
      "sounds/fart-03.wav",
      "sounds/fart-04.wav",
      "sounds/fart-05.wav",
      "sounds/fart-06.wav",
      "sounds/fart-07.wav",
      "sounds/fart-08.wav",
      "sounds/fart-squeak-01.wav",
    ];

    let last = -1;

    function pickIndex() {
      if (SOUNDS.length < 2) return 0;
      let i;
      do {
        i = Math.floor(Math.random() * SOUNDS.length);
      } while (i === last); // never the same one twice in a row
      last = i;
      return i;
    }

    function playFart() {
      // Fresh element each press so rapid clicks overlap instead of cutting off.
      const audio = new Audio(SOUNDS[pickIndex()]);
      audio.play().catch(() => { /* ignore autoplay/decoding hiccups */ });
    }

    function squish() {
      button.classList.add("squish");
      setTimeout(() => button.classList.remove("squish"), 120);
    }

    button.addEventListener("click", () => {
      playFart();
      squish();
    });
  </script>
</body>
</html>
