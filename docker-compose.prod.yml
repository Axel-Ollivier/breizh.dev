services:
  app:
    image: ghcr.io/axel-ollivier/breizhdev:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.breizhdev.rule=Host(`breizh.dev`) || Host(`www.breizh.dev`)"
      - "traefik.http.routers.breizhdev.priority=10"
      - "traefik.http.routers.breizhdev.entrypoints=websecure"
      - "traefik.http.routers.breizhdev.tls.certresolver=letsencrypt"
      - "traefik.http.services.breizhdev.loadbalancer.server.port=8080"

  prout:
    image: ghcr.io/axel-ollivier/prout:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prout.rule=Host(`prout.breizh.dev`)"
      - "traefik.http.routers.prout.entrypoints=websecure"
      - "traefik.http.routers.prout.tls.certresolver=letsencrypt"
      - "traefik.http.services.prout.loadbalancer.server.port=80"

  krampouezh:
    image: ghcr.io/axel-ollivier/krampouezh:latest
    restart: unless-stopped
    # One instance owns the persistent SQLite leaderboard.
    deploy:
      replicas: 1
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Leaderboard__DataPath: /app/data/leaderboard.db
    volumes:
      - krampouezh-data:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.krampouezh.rule=Host(`krampouezh.breizh.dev`)"
      - "traefik.http.routers.krampouezh.entrypoints=websecure"
      - "traefik.http.routers.krampouezh.tls.certresolver=letsencrypt"
      - "traefik.http.services.krampouezh.loadbalancer.server.port=8080"

  riboul:
    image: ghcr.io/axel-ollivier/riboul:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.riboul.rule=Host(`riboul.breizh.dev`)"
      - "traefik.http.routers.riboul.entrypoints=websecure"
      - "traefik.http.routers.riboul.tls.certresolver=letsencrypt"
      - "traefik.http.services.riboul.loadbalancer.server.port=80"

  awen:
    image: ghcr.io/axel-ollivier/awen:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.awen.rule=Host(`awen.breizh.dev`)"
      - "traefik.http.routers.awen.entrypoints=websecure"
      - "traefik.http.routers.awen.tls.certresolver=letsencrypt"
      - "traefik.http.services.awen.loadbalancer.server.port=80"

  idle-consulting:
    image: ghcr.io/axel-ollivier/idle-consulting:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.idle-consulting.rule=Host(`idle.breizh.dev`)"
      - "traefik.http.routers.idle-consulting.entrypoints=websecure"
      - "traefik.http.routers.idle-consulting.tls.certresolver=letsencrypt"
      - "traefik.http.services.idle-consulting.loadbalancer.server.port=80"

  bingo-frontend:
    image: ghcr.io/axel-ollivier/bingo-frontend:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.bingo-frontend.rule=(Host(`breizh.dev`) || Host(`www.breizh.dev`)) && (Path(`/bingo`) || PathPrefix(`/bingo/`))"
      - "traefik.http.routers.bingo-frontend.priority=200"
      - "traefik.http.routers.bingo-frontend.entrypoints=websecure"
      - "traefik.http.routers.bingo-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.bingo-frontend.loadbalancer.server.port=80"

  bingo-backend:
    image: ghcr.io/axel-ollivier/bingo-backend:latest
    restart: unless-stopped
    # In-memory lobbies require exactly one backend instance.
    deploy:
      replicas: 1
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Bingo__DisconnectGraceSeconds: "60"
      Bingo__MaxLobbies: "500"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.bingo-backend.rule=(Host(`breizh.dev`) || Host(`www.breizh.dev`)) && (Path(`/bingo/api`) || PathPrefix(`/bingo/api/`) || Path(`/bingo/hub`) || PathPrefix(`/bingo/hub/`))"
      - "traefik.http.routers.bingo-backend.priority=300"
      - "traefik.http.routers.bingo-backend.entrypoints=websecure"
      - "traefik.http.routers.bingo-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.bingo-backend.loadbalancer.server.port=8080"

volumes:
  krampouezh-data:

networks:
  web:
    external: true
