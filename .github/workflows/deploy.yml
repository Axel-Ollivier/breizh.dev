name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  APP_DIR: /apps/breizhdev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      services: ${{ steps.plan.outputs.services }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      bingo: ${{ steps.plan.outputs.bingo }}
      krampouezh: ${{ steps.plan.outputs.krampouezh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test app selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select affected apps
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_REF=$(git merge-base "$BASE_REF" "$HEAD_REF")
          fi
          python3 .github/scripts/deploy_plan.py --base "$BASE_REF" --head "$HEAD_REF"

  check-bingo:
    needs: changes
    if: needs.changes.outputs.bingo == 'true'
    uses: ./.github/workflows/bingo-check.yml

  check-krampouezh:
    needs: changes
    if: needs.changes.outputs.krampouezh == 'true'
    uses: ./.github/workflows/krampouezh-check.yml

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, check-bingo, check-krampouezh]
    # A suite skipped because its app is unchanged must not block other apps.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.has_changes == 'true' &&
          (needs.check-bingo.result == 'success' || needs.check-bingo.result == 'skipped') &&
          (needs.check-krampouezh.result == 'success' || needs.check-krampouezh.result == 'skipped') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          echo "tag=${IMAGE_TAG,,}:latest" >> $GITHUB_OUTPUT
          echo "sha=${IMAGE_TAG,,}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, build-and-push]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
          needs.changes.result == 'success' && needs.build-and-push.result == 'success' }}
    env:
      SERVICES: ${{ needs.changes.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy docker-compose to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/docker-compose.prod.yml

      - name: Deploy containers
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             cd ${{ env.APP_DIR }} && \
             docker compose -f docker-compose.prod.yml pull $SERVICES && \
             docker compose -f docker-compose.prod.yml up -d --no-deps $SERVICES && \
             docker logout ghcr.io"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
